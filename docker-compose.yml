services:
  app:
    build:
      context: ./app
    container_name: app-educacional
    restart: unless-stopped
    environment:
      CREATEJOY_DB_HOST: db
      CREATEJOY_DB_PORT: 3306
      CREATEJOY_DB_USER: ${MARIADB_USER:-createjoy}
      CREATEJOY_DB_PASSWORD: ${MARIADB_PASSWORD:-createjoy123}
      CREATEJOY_DB_NAME: ${MARIADB_DATABASE:-createjoy_demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://127.0.0.1:8000/api/index.php?route=health' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - monitoring-net

  db:
    image: mariadb:11.4
    container_name: db-educacional
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-createjoy_demo}
      MARIADB_USER: ${MARIADB_USER:-createjoy}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-createjoy123}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-createjoy-root-123}
    ports:
      - "5432:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./app/database/createjoy.sql:/docker-entrypoint-initdb.d/001-createjoy.sql:ro
      - ./app/database/migrations/2026-11-03-rematricula.sql:/docker-entrypoint-initdb.d/002-rematricula.sql:ro
      - ./app/database/migrations/2026-11-04-rematricula-taxa-matricula.sql:/docker-entrypoint-initdb.d/003-taxa-matricula.sql:ro
      - ./app/database/migrations/2026-11-09-access-profiles.sql:/docker-entrypoint-initdb.d/004-perfis-acesso.sql:ro
      - ./app/database/seed-demo.sql:/docker-entrypoint-initdb.d/005-dados-ficticios.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - monitoring-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      cadvisor:
        condition: service_started
      node-exporter:
        condition: service_started
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-Create123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  locust:
    image: locustio/locust:latest
    container_name: locust-load-test
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - ./load-tests:/mnt/locust:ro
    command: -f /mnt/locust/locust_alunos.py --host=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - monitoring-net

networks:
  monitoring-net:
    name: monitoring-net
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
